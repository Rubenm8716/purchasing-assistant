
services:
  postgres:
    image: postgres:16
    container_name: purchasing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: purchasing_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: purchasing_assistant

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchasing_user -d purchasing_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
